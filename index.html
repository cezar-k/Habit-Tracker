<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Habit Tracker</h1>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false">Dark mode</button>
    </header>

    <form class="add-form" id="add-form">
      <label class="visually-hidden" for="habit-name">Habit name</label>
      <input type="text" id="habit-name" class="add-input" placeholder="New habit, e.g. Drink water" required maxlength="100" autocomplete="off">
      <button type="submit" class="add-button">Add</button>
    </form>

    <p class="empty-message" id="empty-message">No habits yet. Add your first one above.</p>
    <ul class="habit-list" id="habit-list"></ul>

    <div class="list-actions">
      <button type="button" class="clear-completed-button" id="clear-completed" disabled>Clear completed</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
